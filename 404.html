<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Дом Капибара</title>
<link rel="icon" href="assets/img/logo-green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800&family=Unbounded:wght@700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--green:#4f7f27;--green-dark:#355a18;--orange:#f7931e;--orange-dark:#d97a08;--text:#2f2418;--radius:28px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--green);color:#fff;font:400 17px/1.6 "Nunito",system-ui,sans-serif;padding:24px 16px}
main{max-width:880px;width:100%;display:grid;gap:32px;align-items:center}
@media(min-width:760px){main{grid-template-columns:1fr 1fr}}
.photo{margin:0;border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.28);background:#7a5230}
.photo img{display:block;width:100%;height:auto}
.logo{width:120px;height:auto;margin-bottom:16px}
.code{font-family:"Unbounded",sans-serif;font-weight:700;font-size:clamp(3.5rem,14vw,6rem);line-height:1;margin:0;color:var(--orange)}
h1{font-family:"Unbounded",sans-serif;font-weight:700;font-size:clamp(1.4rem,5vw,2rem);line-height:1.2;margin:.3em 0 .5em;text-wrap:balance}
p{margin:0 0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--orange);color:var(--text);font-weight:800;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{background:var(--orange-dark);color:#fff}
@media(hover:hover){.btn:hover{transform:translateY(-2px)}}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:no-preference){
  .photo img{animation:bob 5s ease-in-out infinite}
  @keyframes bob{50%{transform:scale(1.03)}}
}
</style>
</head>
<body>
<main>
  <div>
    <a href="index.html" aria-label="Дом Капибара, на главную"><img class="logo" src="assets/img/logo-white.png" alt="Дом Капибара" width="120" height="121"></a>
    <p class="code" aria-hidden="true">404</p>
    <h1>Такой страницы нет. Капибара пошла отдыхать</h1>
    <p>Ссылка устарела или в ней опечатка. Вернитесь на главную и выберите время для экскурсии.</p>
    <a class="btn" href="index.html">На главную</a>
  </div>
  <figure class="photo">
    <img src="assets/img/meme-capybara-sunglasses.jpg" alt="Капибара в круглых очках с молочным коктейлем на фоне парка аттракционов" width="853" height="1066">
  </figure>
</main>
</body>
</html>
